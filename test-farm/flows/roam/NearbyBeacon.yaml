appId: org.scottishtecharmy.soundscape
# Roaming flow: picks a place from Places Nearby, looks at its details and map,
# then walks with an audio beacon on it for a minute before stopping it.
# The walk reorders the list, so the flow doesn't care which place it gets.
---
- runFlow: ../LaunchHome.yaml

- tapOn:
    id: homePlacesNearby
# The first folder is "All", then the places in distance order.
- tapOn:
    id: placesNearby-0
- runFlow:
    file: ../../../maestro/WaitForScreen.yaml
    env:
      screen: PlacesList
      timeout: 90000
- tapOn:
    id: placesNearby-0
# The list re-sorts by distance as the walk moves, and a tap that lands while
# its rows are rebuilt is dropped (seen on the Moto: the list, no details). If
# the details haven't come up, tap again.
- extendedWaitUntil:
    visible:
      id: locationDetailsStartBeacon
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: locationDetailsStartBeacon
    commands:
      - tapOn:
          id: placesNearby-0
          optional: true
- runFlow:
    file: ../../../maestro/WaitForScreen.yaml
    env:
      screen: LocationDetails

- runFlow:
    when:
      true: ${SHOW_MAP !== 'false'}
    commands:
      - tapOn:
          id: locationDetailsFullScreenMapFab
      - runFlow:
          file: ../../../maestro/Wait.yaml
          env:
            timeout: 5000
      - tapOn:
          id: locationDetailsFullScreenMapFab

- tapOn:
    id: locationDetailsStartBeacon
# A tap can be dropped while the page redraws for the moving walk (see
# the place tap above); if the details are still showing, tap again.
- extendedWaitUntil:
    visible:
      id: mainSearchBarCollapsed
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: locationDetailsStartBeacon
    commands:
      - tapOn:
          id: locationDetailsStartBeacon
          optional: true
- runFlow:
    file: ../../../maestro/WaitForScreen.yaml
    env:
      screen: Home
- runFlow:
    file: ../../../maestro/Wait.yaml
    env:
      timeout: 60000
- runFlow: ../StopBeacon.yaml
