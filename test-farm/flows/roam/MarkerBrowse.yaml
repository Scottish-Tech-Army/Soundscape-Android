appId: org.scottishtecharmy.soundscape
# Roaming flow: steps through the Markers list's sort orders and opens each of the
# suite's markers (B and C) as the walk moves away from them. Changes nothing.
#
# The monkey adds markers, so B and C can be below the fold or only partly on
# screen at the bottom, where a tap on them missed; SwipeAndTap brings each
# into view first.
---
- runFlow: ../LaunchHome.yaml

# direction down: Home's top buttons. The nudge up pushed one under the
# search bar on the Cubot (Home scrolls there with a beacon card).
- runFlow:
    file: ../../../maestro/SwipeAndTap.yaml
    env:
      id: homeMarkers
      direction: down
      escapeId: locationDetailsStartBeacon
# Tap through all four sort orders, which ends on the one the list started
# with. Maestro can't see which order is showing (the button reports it as a
# state description, which its text matching ignores), so it can't stop at a
# chosen one, such as name A to Z with B and C near the top.
- tapOn:
    id: SortOption
- tapOn:
    id: SortOption
- tapOn:
    id: SortOption
- tapOn:
    id: SortOption

- runFlow:
    file: ../../../maestro/SwipeAndTap.yaml
    env:
      id: "LocationItem-B-.*"
      escapeId: locationDetailsStartBeacon
# The rows' distances update as the walk moves, and on the Cubot a tap that
# landed while they were redrawn was dropped (see NearbyBeacon); tap again if
# the details haven't opened.
- extendedWaitUntil:
    visible:
      id: locationDetailsStartBeacon
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: locationDetailsStartBeacon
    commands:
      - tapOn:
          id: "LocationItem-B-.*"
          optional: true
- runFlow:
    file: ../../../maestro/WaitForScreen.yaml
    env:
      screen: LocationDetails
- back
# The sort order is whatever the monkey left (the two taps above put it back),
# and furthest first puts C, a little further than B, just above it; the list
# can come back from B's details scrolled with C off the top. SwipeAndTap only
# looks further down, so look up first.
- scrollUntilVisible:
    element:
      id: "LocationItem-C-.*"
    direction: UP
    timeout: 10000
    optional: true
- runFlow:
    file: ../../../maestro/SwipeAndTap.yaml
    env:
      id: "LocationItem-C-.*"
      escapeId: locationDetailsStartBeacon
- extendedWaitUntil:
    visible:
      id: locationDetailsStartBeacon
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: locationDetailsStartBeacon
    commands:
      - tapOn:
          id: "LocationItem-C-.*"
          optional: true
- runFlow:
    file: ../../../maestro/WaitForScreen.yaml
    env:
      screen: LocationDetails
- runFlow:
    when:
      true: ${SHOW_MAP !== 'false'}
    commands:
      - tapOn:
          id: locationDetailsFullScreenMapFab
      - runFlow:
          file: ../../../maestro/Wait.yaml
          env:
            timeout: 5000
      - tapOn:
          id: locationDetailsFullScreenMapFab
- back
- back
