appId: org.scottishtecharmy.soundscape
# Run by the test farm after the monkey soak, held at suite_location, without
# restarting the app. Puts back what the roaming flows and the next upgrade's
# PostUpgrade.yaml rely on and the monkey may have changed:
# - search mode Offline (FarmSettings.yaml);
# - markers B and C and "Test Route" (B -> C), recreated the way the suite
#   made them if they've gone;
# - the map as the farm wants it for roaming (SHOW_MAP, the phone's show_map).
# Fails if they can't be restored, and the farm then sets the phone up again.
#
# Recreating is idempotent: B is saved from the nearest place and C at the
# held location, the same spots the suite used, and saving a marker where one
# already is (say one the monkey renamed) updates that marker.
---
- runFlow: CancelTour.yaml
# A playing beacon's card makes Home taller than a small screen (the Cubot's),
# leaving its buttons scrolled under the search bar where taps miss them.
# Restore doesn't need the beacon.
- runFlow: StopBeacon.yaml
- runFlow: FarmSettings.yaml
# The markers are made with the map off, as in the suite: on a small screen
# the map pushes controls under the bottom bar.
- runFlow:
    file: ShowMap.yaml
    env:
      SHOW: "false"

# Marker B: the first place nearby.
- runFlow:
    file: ../../maestro/SwipeAndTap.yaml
    env:
      id: homeMarkers
# The monkey adds markers, so B can be below the fold: scroll for it before
# deciding it's gone (making another B).
- scrollUntilVisible:
    element:
      id: "LocationItem-B-.*"
    direction: DOWN
    timeout: 20000
    optional: true
- evalScript: ${output.haveB = false}
- runFlow:
    when:
      visible:
        id: "LocationItem-B-.*"
    commands:
      - evalScript: ${output.haveB = true}
- runFlow: LaunchHome.yaml
- runFlow:
    when:
      true: ${!output.haveB}
    commands:
      - runFlow:
          file: ../../maestro/SwipeAndTap.yaml
          env:
            id: homePlacesNearby
            direction: down
      - tapOn:
          id: placesNearby-0
      - runFlow:
          file: ../../maestro/WaitForScreen.yaml
          env:
            screen: PlacesList
            timeout: 90000
      - tapOn:
          id: placesNearby-0
      - tapOn:
          id: locationDetailsSaveAsMarker
          optional: true
      - tapOn:
          id: locationDetailsEditMarker
          optional: true
      - tapOn:
          id: name-clearTextField
          optional: true
      - tapOn:
          id: markerName
      - inputText: "B"
      - tapOn:
          id: flexibleAppBarRight
      - runFlow: LaunchHome.yaml

# Marker C: the current (held) location, from the Markers screen's New button.
- runFlow:
    file: ../../maestro/SwipeAndTap.yaml
    env:
      id: homeMarkers
- scrollUntilVisible:
    element:
      id: "LocationItem-C-.*"
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "LocationItem-C-.*"
    commands:
      - tapOn:
          id: appBarRight
      - tapOn:
          id: addMarkerCurrentLocation
      - tapOn:
          id: name-clearTextField
          optional: true
      - tapOn:
          id: markerName
      - inputText: "C"
      - tapOn:
          id: flexibleAppBarRight
- scrollUntilVisible:
    element:
      id: "LocationItem-C-.*"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "LocationItem-B-.*"
    direction: UP
    timeout: 20000
- runFlow: LaunchHome.yaml

# The route, B then C.
- runFlow:
    file: ../../maestro/SwipeAndTap.yaml
    env:
      id: homeRoutes
- runFlow:
    when:
      notVisible:
        text: "Test Route.*"
    commands:
      - tapOn:
          id: appBarRight
      - tapOn:
          id: routeName
      - inputText: "Test Route"
      - pressKey: Enter
      - tapOn:
          id: addWaypointsButton
      - scrollUntilVisible:
          element:
            id: "LocationItem-B-.*"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "LocationItem-B-.*"
      - scrollUntilVisible:
          element:
            id: "LocationItem-C-.*"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "LocationItem-C-.*"
      - tapOn:
          id: flexibleAppBarRight
      - tapOn:
          id: flexibleAppBarRight
- assertVisible:
    text: "Test Route.*"

- runFlow:
    file: ShowMap.yaml
    env:
      SHOW: ${SHOW_MAP}
