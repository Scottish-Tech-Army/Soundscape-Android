appId: org.scottishtecharmy.soundscape
# Brings the app to the front and gets it back to Home, dismissing the release
# notes dialog if it shows. It appears on the first launch of a new release
# and can turn up after Onboarding; while it's up, Home's anchor isn't visible
# to Maestro.
#
# The app isn't restarted (stopApp: false), so one process runs through all
# the roam rounds and soaks for hours. The previous flow may have left it on
# any screen, or with the search or a dialog open, so it backs out to Home.
#
# Releases before the dialog's testTags were exposed (a dialog is its own
# window, outside the theme's testTagsAsResourceId) need its English button
# text.
---
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    file: ../../maestro/Wait.yaml
    env:
      timeout: 3000
- tapOn:
    id: newReleaseDialogDismiss
    optional: true
- tapOn:
    text: "Close Release Notes"
    optional: true
# The monkey can leave Street Preview ("Simulate Location") on. Its Home has no
# search bar and Back doesn't leave it; its exit button has no testTag, so it's
# found by its accessibility label.
- runFlow:
    when:
      visible:
        text: "Exit location simulation"
    commands:
      - tapOn:
          text: "Exit location simulation"
# The monkey can start the guided tutorial from the menu. Its instructions are
# dialogs which only Continue closes (Back doesn't), and it's cancelled from the
# menu it was started from, once back on Home.
- evalScript: ${output.tour = false}
- repeat:
    while:
      notVisible:
        id: mainSearchBarCollapsed
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: audioTourInstructionContinue
          commands:
            - evalScript: ${output.tour = true}
            - tapOn:
                id: audioTourInstructionContinue
      # The monkey can leave the map full screen. Home has no search bar then and
      # Back leaves the app rather than the full screen map. The same button
      # closes it, and the bottom buttons are hidden while it's open.
      - runFlow:
          when:
            visible:
              id: homeFullScreenMap
            notVisible:
              id: homeMyLocation
          commands:
            - tapOn:
                id: homeFullScreenMap
      # Backing out of another screen can land on Street Preview's Home, which
      # Back doesn't leave either.
      - runFlow:
          when:
            visible:
              text: "Exit location simulation"
          commands:
            - tapOn:
                text: "Exit location simulation"
      # Closing the full screen map may already have reached Home.
      - runFlow:
          when:
            notVisible:
              id: mainSearchBarCollapsed
          commands:
            - back
      - runFlow:
          file: ../../maestro/Wait.yaml
          env:
            timeout: 1000
# Backing out of Home closes the activity (the process and service keep
# running), so bring it back if that happened.
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible:
        id: audioTourInstructionContinue
    commands:
      - evalScript: ${output.tour = true}
      - tapOn:
          id: audioTourInstructionContinue
- runFlow:
    file: ../../maestro/WaitForScreen.yaml
    env:
      screen: Home
- runFlow:
    when:
      true: ${output.tour}
    commands:
      - tapOn:
          id: topBarMenu
      - scrollUntilVisible:
          element:
            id: menuAudioTutorial
          direction: DOWN
      # The item reads "Cancel guided tutorial" while the tour runs; it may
      # already have finished, when tapping it would start a new one.
      - runFlow:
          when:
            visible:
              text: "Cancel guided tutorial"
          commands:
            - tapOn:
                text: "Cancel guided tutorial"
            - tapOn:
                id: audioTourInstructionContinue
      - runFlow:
          when:
            notVisible:
              id: mainSearchBarCollapsed
          commands:
            - back
      - runFlow:
          file: ../../maestro/WaitForScreen.yaml
          env:
            screen: Home
# On a small screen (the Cubot's 480x854) Home scrolls, and stopping a beacon or
# the monkey can leave it scrolled down with Places Nearby, Markers and Routes
# off the top. The flows look for those without scrolling up, so scroll back to
# the top. Bigger phones' Home doesn't scroll, so this never runs on them. The
# swipe starts below the search bar and above the fixed bottom bar. Maestro
# counts a button scrolled under the search bar as visible, so the button has
# to be below the search bar too.
- repeat:
    while:
      notVisible:
        id: homePlacesNearby
        below:
          id: mainSearchBarCollapsed
    times: 3
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 70%
