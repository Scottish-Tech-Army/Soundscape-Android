appId: org.scottishtecharmy.soundscape
# Stops the audio beacon if one is still playing. A beacon on a nearby place
# ends by itself when the walk reaches it, so there may be nothing to stop.
# On a phone whose Home scrolls (HOME_SCROLLS, the farm's home_scrolls: the
# Cubot's small screen) the beacon card can sit below the fold, so look further
# down before deciding it has gone. Elsewhere Home doesn't scroll, and the
# swipes only risked landing on something. The swipe starts no lower than 60%: on
# a small screen (the Cubot's 480x854) Home's fixed bottom bar starts at about
# 68%, and a swipe from 70% scrolled nothing, so the beacon was left playing.
---
- evalScript: ${output.stopScrolled = false}
- runFlow:
    when:
      true: ${HOME_SCROLLS === 'true'}
      notVisible:
        id: routeStop
    commands:
      - evalScript: ${output.stopScrolled = true}
      - swipe:
          start: 50%, 60%
          end: 50%, 30%
      # On the Cubot a swipe now and then lands as a tap (see SwipeAndTap's
      # escapeId), and on its Home every row a swipe can start on is a button.
      # Back only from a screen with a Back button: on Home it leaves the app
      # (a check for Home's search bar right after a swipe missed it once).
      - runFlow:
          when:
            visible:
              id: appBarLeft
          commands:
            - back
- tapOn:
    id: routeStop
    optional: true
# Back to the top, where the flows after this expect Home's buttons (see the
# end of LaunchHome.yaml). Home doesn't scroll on bigger phones, so then this
# moves nothing.
- runFlow:
    when:
      true: ${output.stopScrolled}
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 70%
      # As above.
      - runFlow:
          when:
            visible:
              id: appBarLeft
          commands:
            - back
