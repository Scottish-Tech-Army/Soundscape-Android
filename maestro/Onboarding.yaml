appId: org.scottishtecharmy.soundscape
---
- launchApp:
    clearState: true
    permissions:
        all: allow

# iOS 26 sims show a system-level "Allow widgets from Maps to use your
# location" dialog on fresh boots. It floats above our app and blocks Maestro
# from reaching the Welcome screen. permissions.all: allow on launchApp only
# covers our own app's runtime prompts, not Springboard widget prompts, so we
# dismiss it explicitly here. optional: true means the flow still passes if
# the dialog never appears (Android, warm sims). It should only fire once per
# sim session, so subsequent flows don't need the same guard.
- tapOn:
    text: "Don.t Allow"
    optional: true

- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Welcome

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "welcomeScreenContinueButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "languageScreenContinueButton"

# The Navigating (permissions) and Battery screens skip themselves when there is
# nothing to grant. launchApp's permissions block above always grants the
# Navigating screen's permissions, and the battery exemption can survive
# clearState, so either screen may never show. The fixed wait gives a skipping
# screen time to move on before checking whether it is still there.
- runFlow:
    when:
      platform: Android
    file: Wait.yaml
    env:
      timeout: 2000

- runFlow:
    when:
      visible:
        id: "navigatingScreenContinueButton"
    file: SwipeAndTap.yaml
    env:
      id: "navigatingScreenContinueButton"

- runFlow:
    when:
      platform: Android
    file: Wait.yaml
    env:
      timeout: 2000

# Battery optimization screen. Tapping "Grant permission" launches a system
# dialog (ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS) which is not a runtime
# permission, so it is not handled by the launchApp permissions block. We wait
# for the system dialog's positive button and tap it, then continue.
- runFlow:
    when:
      visible:
        id: "batteryOptimizationGrantPermissionButton"
    commands:
      - runFlow:
          file: SwipeAndTap.yaml
          env:
            id: "batteryOptimizationGrantPermissionButton"
      - runFlow:
          file: Wait.yaml
          env:
            timeout: 3000
      # The system dialog only appears if the app isn't already exempt.
      - tapOn:
          id: "android:id/button1"
          optional: true
      - runFlow:
          file: Wait.yaml
          env:
            timeout: 2000
      # Granting the exemption moves on to the next screen by itself; Continue
      # is only left to tap if it was refused.
      - runFlow:
          when:
            visible:
              id: "batteryOptimizationContinueButton"
          file: SwipeAndTap.yaml
          env:
            id: "batteryOptimizationContinueButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "listeningScreenContinueButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "hearingScreenContinueButton"

- runFlow:
    when:
      platform: iOS
    file: SwipeAndTap.yaml
    env:
      id: "permissionsScreenContinueButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "CurrentButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "audioBeaconsContinueButton"

- runFlow:
    when:
      platform: Android
    file: SwipeAndTap.yaml
    env:
      id: "offlineStorageOnboardingScreenContinueButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "accessibilityOnboardingScreenShowMapToggle"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "accessibilityOnboardingScreenContinueButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "termsScreenAgree"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "termsScreenContinueButton"

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: "finishScreenContinueButton"

# The "new release" dialog only appears for certain version/build states.
# Dismiss it if present; optional means the flow still passes if it never shows.
- tapOn:
    id: "newReleaseDialogDismiss"
    optional: true
