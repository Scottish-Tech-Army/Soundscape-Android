appId: org.scottishtecharmy.soundscape
# Exercises the Markers screen: the sort controls, editing an existing marker,
# and creating marker "C" at the current location with the New button.
#
# Depends on markers "A" and "B" having been created by LocationDetails.yaml, so
# this flow must run after it in the suite.
---
- launchApp:
    clearState: false

- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Home

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: homeMarkers

- assertVisible:
    id: "LocationItem-A-0"
- assertVisible:
    id: "LocationItem-B-1"

- assertVisible:
    id: "LocationItem-A-.*"
- assertVisible:
    id: "LocationItem-B-.*"

# Open marker A and edit its annotation, then save.
- tapOn:
    id: "LocationItem-A-.*"
- tapOn:
    id: locationDetailsEditMarker
- tapOn:
    id: notes-clearTextField
    optional: true      # If the notes are empty, then there's no clear text button
- tapOn:
    id: markerAnnotation
- inputText: "Updated by Maestro"
- tapOn:
    id: flexibleAppBarRight

# Create marker C from the New button, using the current location.
- runFlow:
    file: WaitForScreen.yaml
    env:
      screen: Home
- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: homeMarkers
- tapOn:
    id: appBarRight
- tapOn:
    id: addMarkerCurrentLocation
- tapOn:
    id: name-clearTextField
- tapOn:
    id: markerName
- inputText: "C"
- tapOn:
    id: flexibleAppBarRight

# Saving returns to the Markers screen, which now lists C.
- assertVisible:
    id: "LocationItem-C-.*"
