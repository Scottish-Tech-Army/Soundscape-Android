appId: org.scottishtecharmy.soundscape
# Creates a new route from the Routes screen, adds two existing markers as
# waypoints, saves it, and verifies it appears in the routes list.
#
# Depends on marker "B" from LocationDetails.yaml and marker "C" from
# Markers.yaml (which replaces "A"), so this flow must run after both.
---
- launchApp:
    clearState: false

- runFlow:
        file: WaitForScreen.yaml
        env:
              screen: Home

- runFlow:
    file: SwipeAndTap.yaml
    env:
      id: homeRoutes

# The New button at the top right creates a route.
- tapOn:
    id: appBarRight

# Name the route.
- tapOn:
    id: routeName
- inputText: "Test Route"
- pressKey: Enter

# Add the existing markers B and C as waypoints. They are listed by name; the
# orderId suffix is unknown here so match by name prefix.
- tapOn:
    id: addWaypointsButton
- tapOn:
    id: "LocationItem-B-.*"
- tapOn:
    id: "LocationItem-C-.*"
# "Done" in the waypoints dialog (reuses the shared app-bar right button).
- tapOn:
    id: flexibleAppBarRight

# "Done" on the route screen saves the route and returns to the Routes tab.
- tapOn:
    id: flexibleAppBarRight

# The new route should now be listed.
- assertVisible:
    text: "Test Route.*"
