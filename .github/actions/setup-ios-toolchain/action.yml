name: Setup iOS toolchain
description: |
  Pins Xcode, installs xcodegen, and sets up JDK + Gradle (needed by the
  Kotlin shared module's Xcode pre-build script). The caller is responsible
  for running `xcodegen generate` AFTER writing iosApp/Local.xcconfig (it is
  gitignored, so a fresh checkout has no copy and xcodegen would fail).

inputs:
  xcode_version:
    # Kotlin 2.2.x's bundled Native toolchain references the Xcode 16.4
    # default toolchain path (see Kotlin/Native release notes). Mismatching
    # versions produce `ld: search path '/Applications/Xcode_16.4.app/...
    # not found` warnings followed by link failures.
    description: Xcode version to select on the runner.
    required: false
    default: '16.4'

runs:
  using: composite
  steps:
    - name: Free disk space on self-hosted runner
      # The self-hosted Mac accumulates Xcode's DerivedData across every
      # build (each archive/test run regenerates gigabytes of intermediates
      # and it's never purged), which eventually fills the disk and fails
      # the Kotlin/Native link step with "No space left on device" even
      # though nothing about the build itself is broken. DerivedData is
      # fully regenerable, so wiping it before each run trades a bit of
      # incremental-build speed for not dying to disk exhaustion.
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        df -h / || true
        rm -rf "$HOME/Library/Developer/Xcode/DerivedData/iosApp-"*
        df -h / || true

    - name: Select Xcode
      # Self-hosted runners use whatever Xcode is already installed; only
      # GitHub-hosted runners need the version pinned via setup-xcode.
      if: runner.environment != 'self-hosted'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode_version }}

    - name: Install xcodegen
      shell: bash
      run: brew install xcodegen

    - name: Setup JDK + Gradle
      uses: ./.github/actions/setup-jdk-gradle

    - name: Stop stale Gradle daemons on self-hosted
      # A self-hosted runner is a persistent machine, so a Gradle daemon left
      # running (or stuck) by an earlier job can get reused by this one and
      # blow up project configuration. Kill any before the job does its own
      # Gradle work.
      if: runner.environment == 'self-hosted'
      shell: bash
      run: ./gradlew --stop

    - name: Repair project-local Gradle cache on self-hosted
      # actions/checkout's `git clean -ffdx` wipes the gitignored .gradle
      # directory, and a daemon still winding down from the previous job can
      # race it, leaving a tree where Gradle's own mkdirs fails during service
      # startup with "Cannot create directory '.../.gradle/configuration-cache'".
      # Check the directory is creatable and writable here, where a failure is
      # diagnosable, instead of inside Gradle's startup. Only an unusable cache
      # is wiped, so a healthy configuration cache is still reused.
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        cc=".gradle/configuration-cache"
        if [ -e "$cc" ] && [ ! -d "$cc" ]; then
          echo "$cc exists but is not a directory; removing"
          rm -rf "$cc"
        fi
        if ! mkdir -p "$cc" 2>/dev/null || [ ! -w "$cc" ]; then
          echo "Cannot use $cc; wiping .gradle and recreating"
          rm -rf .gradle
          mkdir -p "$cc"
        fi

    - name: Ensure ANDROID_HOME on self-hosted
      # The shared Kotlin Multiplatform module has an `android` target, so the
      # Xcode pre-build script that invokes Gradle needs the SDK location.
      # GitHub-hosted runners ship with ANDROID_HOME pre-set; self-hosted
      # macOS runners do not, so resolve the default user install location.
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        if [ -n "${ANDROID_HOME:-}" ]; then
          echo "ANDROID_HOME already set: $ANDROID_HOME"
          exit 0
        fi
        sdk="$HOME/Library/Android/sdk"
        if [ ! -d "$sdk" ]; then
          echo "::error::ANDROID_HOME is unset and no SDK found at $sdk"
          exit 1
        fi
        echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
