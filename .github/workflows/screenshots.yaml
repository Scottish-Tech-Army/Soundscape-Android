name: Generate test screenshots

# Renders every Compose preview in app/src/screenshotTest in every app language,
# so that a native speaker can check their translation in context without
# running the app.
#
# This used to be a step in build-app.yaml, but rendering everything in one JVM
# ran out of memory, and the release build is the wrong place for a slow optional
# step. Here the tests are split across parallel shards by the first letter of
# the test name, then each language is zipped and published as an asset on the
# translation-screenshots release, which the docs link to.

on:
  # Run by hand from the Actions tab when translations want reviewing.
  workflow_dispatch:

jobs:
  render:
    name: Render screenshots (${{ matrix.shard.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every test in ThemeTestClass must match exactly one shard. The Settings
        # sections and help pages render on a tall device, so the shards holding
        # them (H, S) are kept smaller.
        shard:
          - { name: a-g, letters: "A B C D E F G" }
          - { name: h-l, letters: "H I J K L" }
          - { name: m-r, letters: "M N O P Q R" }
          - { name: s-z, letters: "S T U V W X Y Z" }

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK + Gradle
        uses: ./.github/actions/setup-jdk-gradle

      - name: Render screenshots
        run: |
          filters=()
          for letter in ${{ matrix.shard.letters }}; do
            filters+=(--tests "org.scottishtecharmy.soundscape.ThemeTestClass.${letter}*")
          done
          ./gradlew updateDebugScreenshotTest "${filters[@]}"

      - name: Sort screenshots by language
        run: ./categorise.sh app/src/screenshotTestDebug/reference/org/scottishtecharmy/soundscape/ThemeTestClass/

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard.name }}
          path: app/src/screenshotTestDebug/reference/org/scottishtecharmy/soundscape/ThemeTestClass/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish screenshots
    needs: render
    runs-on: ubuntu-latest
    permissions:
      # To create the release and replace its assets.
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: screenshots
          merge-multiple: true

      # One zip per language, named with the Weblate code that each preview is named
      # after, so that docs/help-translate.md can link every language to its own.
      # SmallFont and LargeFont are English at other font scales, which are for
      # checking layout rather than translation, so they aren't published.
      - name: Zip each language
        run: |
          mkdir zips
          cd screenshots
          for dir in */; do
            code=${dir%/}
            case "$code" in SmallFont|LargeFont) continue ;; esac
            (cd "$code" && zip -qr "../../zips/screenshots-$code.zip" .)
          done
          ls -l ../zips

      # A pre-release that is never marked latest, so that it can't be mistaken for an
      # app release. Its asset URLs stay the same from one run to the next.
      - name: Publish to the translation-screenshots release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=translation-screenshots
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Translation screenshots" \
              --notes "Screenshots of the app in each language, for native speakers checking a translation. See https://scottish-tech-army.github.io/Soundscape-Android/help-translate/. Not an app release: regenerated by the screenshots.yaml workflow."
          fi
          gh release upload "$tag" zips/*.zip --clobber

          # Remove any zip this run didn't produce, e.g. for a language since dropped.
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r name; do
            [[ -f "zips/$name" ]] || gh release delete-asset "$tag" "$name" --yes
          done

      # Also kept as a single artifact on the run, for checking a run before relying
      # on the release.
      - uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: zips/
          if-no-files-found: error
